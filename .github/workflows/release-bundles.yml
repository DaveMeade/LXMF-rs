name: Release Bundles

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag name to embed in bundle filenames
        required: true
        type: string
      publish_release:
        description: Publish uploaded bundle artifacts to the matching GitHub release
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version format
        run: |
          [[ "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z]+)?$ ]]
      - name: Require an existing tag before manual publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          git rev-parse -q --verify "refs/tags/$RELEASE_VERSION"

  sdk-wrapper-parity:
    needs: validate-release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: SDK wrapper parity gate
        run: cargo test -p test-support sdk_wrapper_parity_release_gate

  build-bundles:
    needs: [validate-release-version, sdk-wrapper-parity]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: daemon-bundle-linux
            rust_target: ""
          - os: macos-latest
            artifact_name: daemon-bundle-macos
            rust_target: ""
          - os: windows-latest
            artifact_name: daemon-bundle-windows
            rust_target: ""
          - os: ubuntu-latest
            artifact_name: daemon-bundle-linux-arm64
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux' && matrix.rust_target == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install Linux ARM64 bundle dependencies
        if: runner.os == 'Linux' && matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libdbus-1-dev:arm64
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Build daemon bundle
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
        run: |
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            cargo xtask package-daemon-bundle --version "$RELEASE_VERSION" --target "${{ matrix.rust_target }}"
          else
            cargo xtask package-daemon-bundle --version "$RELEASE_VERSION"
          fi
      - name: Build daemon bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo --config 'build.rustc-wrapper=""' xtask package-daemon-bundle --version "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release-bundles/*
          if-no-files-found: error

  publish-release:
    needs: build-bundles
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: daemon-bundle-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-rc') || contains(env.RELEASE_VERSION, 'preview') }}
