name: Publish crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, tag, or SHA to publish from
        required: true
        type: string
      dry_run:
        description: Validate package contents without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-publish-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish public crates
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          manifests=(
            "crates/libs/lxmf-reference/Cargo.toml"
            "crates/libs/rns-core/Cargo.toml"
            "crates/libs/lxmf-core/Cargo.toml"
            "crates/libs/rns-transport/Cargo.toml"
            "crates/libs/rns-rpc/Cargo.toml"
            "crates/libs/lxmf-sdk/Cargo.toml"
            "crates/libs/reticulum-rs/Cargo.toml"
            "crates/libs/lxmf/Cargo.toml"
          )

          crate_field() {
            local manifest="$1"
            local field="$2"
            cargo metadata --no-deps --format-version 1 --manifest-path "$manifest" \
              | jq -r ".packages[0].$field"
          }

          crate_version_exists() {
            local package="$1"
            local version="$2"
            local status
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "https://crates.io/api/v1/crates/${package}/${version}")"
            [[ "$status" == "200" ]]
          }

          wait_for_crate_version() {
            local package="$1"
            local version="$2"

            for _ in {1..20}; do
              if crate_version_exists "$package" "$version"; then
                return 0
              fi
              sleep 15
            done

            echo "::error::Timed out waiting for ${package} ${version} to appear on crates.io"
            return 1
          }

          for manifest in "${manifests[@]}"; do
            package="$(crate_field "$manifest" name)"
            version="$(crate_field "$manifest" version)"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Dry-running ${package} ${version}"
              cargo package --list --locked --manifest-path "$manifest"
              continue
            fi

            if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
              echo "::error::CARGO_REGISTRY_TOKEN repository secret is required for crates.io publishing"
              exit 1
            fi

            if crate_version_exists "$package" "$version"; then
              echo "${package} ${version} already exists on crates.io; skipping"
              continue
            fi

            echo "Publishing ${package} ${version}"
            cargo publish --locked --manifest-path "$manifest"
            wait_for_crate_version "$package" "$version"
          done
